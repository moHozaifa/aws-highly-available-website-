<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="Arial, Helvetica, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect width="1000" height="650" fill="#ffffff"/>

  <!-- User -->
  <rect x="290" y="12" width="140" height="42" rx="8" fill="#eceff1" stroke="#37474f"/>
  <text x="360" y="38" text-anchor="middle" fill="#1b2430" font-weight="bold">Users (Internet)</text>

  <!-- Region -->
  <rect x="20" y="72" width="960" height="568" rx="10" fill="none" stroke="#546e7a" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="34" y="94" fill="#37474f" font-weight="bold">AWS Region: ap-south-1 (Mumbai)</text>

  <!-- VPC -->
  <rect x="40" y="104" width="640" height="522" rx="8" fill="#f3f8f4" stroke="#2e7d32" stroke-width="2"/>
  <text x="54" y="125" fill="#1b5e20" font-weight="bold">VPC: ha-vpc (10.0.0.0/16)</text>

  <!-- IGW -->
  <rect x="295" y="135" width="130" height="38" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="360" y="159" text-anchor="middle" fill="#1b2430">Internet Gateway</text>

  <!-- ALB -->
  <rect x="245" y="205" width="230" height="62" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="360" y="229" text-anchor="middle" fill="#0d47a1" font-weight="bold">Application Load Balancer</text>
  <text x="360" y="249" text-anchor="middle" fill="#1b2430" font-size="12">ha-alb | SG: ha-alb-sg | HTTP 80</text>

  <!-- ASG -->
  <rect x="62" y="296" width="596" height="318" rx="8" fill="none" stroke="#ef6c00" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="360" y="603" text-anchor="middle" fill="#e65100" font-weight="bold">Auto Scaling Group: ha-asg (min 2, max 4, scales at 50% average CPU)</text>

  <!-- AZ 1 -->
  <rect x="76" y="318" width="278" height="246" rx="6" fill="#ffffff" stroke="#90a4ae"/>
  <rect x="90" y="332" width="250" height="196" rx="6" fill="#fafafa" stroke="#2e7d32"/>
  <rect x="120" y="372" width="190" height="96" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="215" y="400" text-anchor="middle" fill="#bf360c" font-weight="bold">EC2 instance</text>
  <text x="215" y="420" text-anchor="middle" fill="#1b2430" font-size="12">Amazon Linux 2023 + Nginx</text>
  <text x="215" y="440" text-anchor="middle" fill="#1b2430" font-size="12">SG: ha-web-sg</text>
  <text x="215" y="508" text-anchor="middle" fill="#1b5e20" font-size="12">Subnet: ha-public-1a (10.0.1.0/24)</text>
  <text x="215" y="550" text-anchor="middle" fill="#37474f" font-size="12">Availability Zone: ap-south-1a</text>

  <!-- AZ 2 -->
  <rect x="366" y="318" width="278" height="246" rx="6" fill="#ffffff" stroke="#90a4ae"/>
  <rect x="380" y="332" width="250" height="196" rx="6" fill="#fafafa" stroke="#2e7d32"/>
  <rect x="410" y="372" width="190" height="96" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="505" y="400" text-anchor="middle" fill="#bf360c" font-weight="bold">EC2 instance</text>
  <text x="505" y="420" text-anchor="middle" fill="#1b2430" font-size="12">Amazon Linux 2023 + Nginx</text>
  <text x="505" y="440" text-anchor="middle" fill="#1b2430" font-size="12">SG: ha-web-sg</text>
  <text x="505" y="508" text-anchor="middle" fill="#1b5e20" font-size="12">Subnet: ha-public-1b (10.0.2.0/24)</text>
  <text x="505" y="550" text-anchor="middle" fill="#37474f" font-size="12">Availability Zone: ap-south-1b</text>

  <!-- Right column services -->
  <rect x="715" y="122" width="245" height="60" rx="8" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="837" y="146" text-anchor="middle" fill="#4a148c" font-weight="bold">Amazon CloudWatch</text>
  <text x="837" y="166" text-anchor="middle" fill="#1b2430" font-size="12">Alarm: UnHealthyHostCount</text>

  <rect x="715" y="215" width="245" height="60" rx="8" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="837" y="239" text-anchor="middle" fill="#4a148c" font-weight="bold">Amazon SNS: ha-alerts</text>
  <text x="837" y="259" text-anchor="middle" fill="#1b2430" font-size="12">Sends email alert</text>

  <rect x="715" y="335" width="245" height="60" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="837" y="359" text-anchor="middle" fill="#1b5e20" font-weight="bold">Amazon S3 bucket (private)</text>
  <text x="837" y="379" text-anchor="middle" fill="#1b2430" font-size="12">index.html</text>

  <rect x="715" y="445" width="245" height="60" rx="8" fill="#ffebee" stroke="#c62828"/>
  <text x="837" y="469" text-anchor="middle" fill="#b71c1c" font-weight="bold">IAM Role: ha-ec2-role</text>
  <text x="837" y="489" text-anchor="middle" fill="#1b2430" font-size="12">S3 GetObject only (least privilege)</text>

  <!-- Arrows -->
  <line x1="360" y1="54" x2="360" y2="133" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="372" y="98" fill="#37474f" font-size="12">HTTP</text>
  <line x1="360" y1="173" x2="360" y2="203" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="310" y1="267" x2="230" y2="370" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="410" y1="267" x2="490" y2="370" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>

  <line x1="475" y1="236" x2="713" y2="156" stroke="#6a1b9a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="837" y1="182" x2="837" y2="213" stroke="#6a1b9a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="713" y1="365" x2="602" y2="430" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="713" y1="475" x2="602" y2="455" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- Legend -->
  <text x="715" y="545" fill="#37474f" font-size="12" font-weight="bold">Legend</text>
  <line x1="715" y1="560" x2="755" y2="560" stroke="#37474f" stroke-width="2"/>
  <text x="763" y="564" fill="#1b2430" font-size="12">User traffic</text>
  <line x1="715" y1="580" x2="755" y2="580" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="763" y="584" fill="#1b2430" font-size="12">Files, permissions, metrics</text>
</svg>
